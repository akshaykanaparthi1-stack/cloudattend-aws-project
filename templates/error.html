{% extends "base.html" %}

{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block topbar_title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 580px; margin: 3rem auto; text-align: center;">
    <div class="card-body" style="padding: 3rem 2rem;">
        <div style="font-size: 4rem; font-weight: 800; color: var(--color-blue-primary); line-height: 1; margin-bottom: 1rem;">
            {{ code }}
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--color-navy-dark); margin-bottom: 0.75rem;">
            {{ title }}
        </h2>
        <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
            {{ message }}
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                Return to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
